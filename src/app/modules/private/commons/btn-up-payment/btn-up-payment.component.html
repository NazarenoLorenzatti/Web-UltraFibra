<div class="fixed bottom-0 right-0 z-5 h-6rem w-6rem flex justify-content-center align-items-center">
    <div (click)="op.toggle($event)" class="w-full h-full relative flex justify-content-center align-items-center cursor-pointer">
        <div class="heartbeat relative z-5 h-5rem w-5rem flex justify-content-center align-items-center border-circle"
            style="background-color: #c8be00"  pTooltip="Informar Pago" tooltipPosition="left">
            <i class="pi pi-upload" style="font-size: 2rem"></i>
        </div>
        <div [ngClass]="{ 'chip-in': showDiv, 'chip-out': !showDiv }" class="absolute chip flex justify-content-start pl-4 align-items-center">
            <div class="text-lg font-light">INFORMAR PAGO</div>
        </div>
    </div>
</div>
<p-overlayPanel class="border-round-2xl" #op>
    <app-up-payment></app-up-payment>    
</p-overlayPanel>
