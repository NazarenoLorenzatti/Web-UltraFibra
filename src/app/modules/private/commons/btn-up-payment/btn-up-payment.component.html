<div class="payment-float" [class.payment-float--open-label]="showDiv">
  <button
    type="button"
    class="payment-float__button heartbeat"
    (click)="op.toggle($event)"
    pTooltip="Informar pago"
    tooltipPosition="left"
    aria-label="Informar pago">
    <i class="pi pi-upload"></i>
  </button>

  <div class="payment-float__label" [class.payment-float__label--visible]="showDiv">
    <span>Informar pago</span>
    <small>Adjuntá tu comprobante</small>
  </div>
</div>

<p-overlayPanel
  #op
  styleClass="payment-overlay"
  [showCloseIcon]="true">
  <app-up-payment></app-up-payment>
</p-overlayPanel>
