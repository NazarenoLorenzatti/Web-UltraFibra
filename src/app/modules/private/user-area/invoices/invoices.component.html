<p-toast></p-toast>

<section class="page-container">

  <!-- TOP KPIs / ACCIONES -->
  <div class="top-grid">

    <!-- TOTAL -->
    <div class="total-card">
      <span>Total a pagar</span>
      <strong>$ {{ clientData.cuentas.debt | number:'1.2-2' }}</strong>
    </div>

    <!-- BOTÓN PAGAR -->
    <button *ngIf="clientData.cuentas.invoices && isOfficialClient"
      class="pay-btn-main"
      (click)="redirectToPayment(clientData.cuentas.invoices[clientData.cuentas.invoices.length - 1].payments_url.macro)">
      <i class="pi pi-credit-card"></i>
      Pagar Comprobante más antiguo
    </button>

    <div *ngIf="!clientData.cuentas.invoices" class="no-invoices">
      No tiene Comprobantes abiertos
    </div>

    <!-- ACCIONES -->
    <div class="actions-card">

      <button class="action-btn" (click)="navigateTo('/user/services')">
        <i class="pi pi-server"></i>
        Mis servicios
      </button>

      <button class="action-btn" (click)="isDialogVisible=true">
        <i class="pi pi-wallet"></i>
        Medios de pago
      </button>

      <button *ngIf="clientData.cuentas.invoices[0].tipo != 'FX'"
        class="action-btn"
        (click)="downloadInvoice(clientData.cuentas.invoices[0].url_pdf)">
        <i class="pi pi-download"></i>
        Descargar último Comprobante
      </button>

    </div>

  </div>

  <!-- TABLA -->
  <div class="table-container">

    <p-table [value]="currentAccountData"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5,10,20]"
      responsiveLayout="scroll"
      class="custom-table">

      <ng-template pTemplate="header">
        <tr>
          <th>Comprobante</th>
          <th class="hidden md:table-cell">Número</th>
          <th>Vencimiento</th>
          <th>Importe</th>
          <th class="text-center">Acción</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-comp>
        <tr>

          <td>
            <div class="invoice-type">
              <ng-container *ngIf="comp.tipo !== 'FX'; else noPdf">
                <a [href]="comp.pdf" class="invoice-link">
                  <i class="pi pi-file-pdf"></i>
                  {{ comp.fecha | monthName }}
                </a>
              </ng-container>

              <ng-template #noPdf>
                <span class="invoice-text">
                  {{ comp.fecha | monthName }}
                </span>
              </ng-template>
            </div>
          </td>

          <td class="hidden md:table-cell">
            {{ comp.sucursal }} {{ comp.numero }}
          </td>

          <td>{{ comp.fecha_vto }}</td>

          <td>
            <span class="amount"
              [ngClass]="{
                'debt': comp.saldo > 0,
                'paid': comp.saldo <= 0
              }">
              ${{ comp.saldo }}
            </span>
          </td>

          <td class="text-center">
            <button *ngIf="comp.macro"
              class="pay-btn-row"
              (click)="redirectToPayment(comp.macro)">
              <i class="pi pi-credit-card"></i>
              <span class="hidden sm:inline">Pagar</span>
            </button>
          </td>

        </tr>
      </ng-template>

    </p-table>

  </div>

</section>
