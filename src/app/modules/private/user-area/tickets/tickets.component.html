<p-toast></p-toast>

<section class="tickets-page">

  <!-- OVERLAY ESTADO -->
  <div *ngIf="client.a_status === 'Deudor'" class="status-overlay warning">
    <div class="status-box">
      <i class="pi pi-exclamation-triangle"></i>
      <h2>Servicio suspendido</h2>
      <p>Regularice su deuda para reactivar el servicio.</p>
    </div>
  </div>

  <div *ngIf="client.a_status === 'Baja' || client.a_status === 'Inactivo'" class="status-overlay danger">
    <div class="status-box">
      <i class="pi pi-times-circle"></i>
      <h2>Servicio dado de baja</h2>
      <p>Comuníquese con soporte.</p>
    </div>
  </div>

  <!-- MENSAJE -->
  <div class="alert-box"
    [ngClass]="{
      'success': messagesTickets[0].severity=='success',
      'warn': messagesTickets[0].severity=='warn'
    }">

    <i class="{{messagesTickets[0].icon}}"></i>
    <div>
      <strong>{{messagesTickets[0].summary}}</strong>
      <p>{{messagesTickets[0].detail}}</p>
    </div>

  </div>

  <!-- LAYOUT -->
  <div class="tickets-layout">

    <!-- FORM -->
    <form [formGroup]="formulario"
      (ngSubmit)="onSubmit()"
      [class.disabled]="client.casos_abiertos >= 4"
      class="ticket-form">

      <p-dropdown
        [options]="client.contratos"
        [(ngModel)]="selectedContracts"
        optionLabel="domicilio"
        placeholder="Seleccione el contrato"
        formControlName="contract"
        appendTo="body">
      </p-dropdown>

      <p-dropdown
        [options]="typeTickets"
        [(ngModel)]="selectedTypeTickets"
        optionLabel="name"
        placeholder="Seleccione el tipo de reclamo"
        formControlName="ticket"
        appendTo="body">
      </p-dropdown>

      <input type="text" pInputText formControlName="celular" placeholder="Celular de contacto" />

      <input type="text" pInputText formControlName="TelFijo" placeholder="Teléfono de contacto" />

      <textarea rows="4"
        pInputTextarea
        formControlName="text"
        placeholder="Escriba su consulta">
      </textarea>

      <button type="submit"  style="color:rgb(34, 34, 33)"
        [disabled]="!formulario.valid || client.a_status === 'Deudor' || client.a_status === 'Baja'">
        <i class="pi pi-send"></i>
        Crear ticket
      </button>

    </form>

    <!-- INFO -->
    <div class="ticket-stats">

      <div class="stat-card">
        <i class="pi pi-ticket mr-2"></i>
        <span class="mr-2">Órdenes abiertas</span>
        <strong>{{ countOrders() }}</strong>
      </div>

      <div class="stat-card highlight">
        Usted tiene {{countOrders()}} órdenes de servicio abiertas
      </div>

    </div>

  </div>

</section>
