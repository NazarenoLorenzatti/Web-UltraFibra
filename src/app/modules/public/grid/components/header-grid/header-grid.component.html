<section *ngIf="backgroundImg; else headerLoading"
    class="channels-hero"
    [style.background-image]="
        'linear-gradient(90deg, rgba(4,10,24,.90) 0%, rgba(4,10,24,.68) 48%, rgba(4,10,24,.26) 100%), url('
        + backgroundImg + ')'
    ">

    <div class="hero-grid" aria-hidden="true"></div>
    <div class="hero-glow" aria-hidden="true"></div>

    <div class="hero-content">
        <span class="hero-eyebrow">
            ULTRAFIBRA
            <span>·</span>
            TV
        </span>

        <h1>Tu grilla.<br><span>Todo en un mismo lugar.</span></h1>

        <p>
            Consultá nuestros canales, encontrá rápidamente el número que buscás
            y descubrí qué opciones están disponibles en tu servicio.
        </p>

        <a class="hero-button" href="#" (click)="onScrollToPlans(); $event.preventDefault()">
            Ver canales
            <span aria-hidden="true">↓</span>
        </a>
    </div>

    <div class="hero-note" aria-hidden="true">
        <span></span>
        Guía de canales UltraFibra
    </div>
</section>

<ng-template #headerLoading>
    <section class="channels-hero channels-hero--loading">
        <p-progressSpinner
            styleClass="w-4rem h-4rem"
            strokeWidth="8"
            fill="var(--green-400)"
            animationDuration=".5s">
        </p-progressSpinner>
    </section>
</ng-template>
