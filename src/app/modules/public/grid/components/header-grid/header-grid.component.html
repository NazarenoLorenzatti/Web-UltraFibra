<!-- HERO -->
<section class="liga-hero">
    <div class="hero-content">
        <img src="./assets/images/products/logo-liga.png" alt="Liga Profesional" />

        <h1>Disfrutá todos los partidos de la Liga</h1>
        <h2>con nuestro servicio de TV</h2>

        <p>Pack Fútbol incluido sin costo adicional</p>
    </div>
</section>

<!-- CANALES -->
<section
    class="liga-parallax"
    [style.background-image]="
      'linear-gradient(180deg,
        rgba(1,6,18,0.85) 0%,
        rgba(1,6,18,0.65) 50%,
        rgba(1,6,18,0.9) 100%
      ), url(' + backgroundImg + ')'
    "
>
    <div class="channels-wrapper">

        <div class="channel-card">
            <img src="./assets/images/products/logo-espn-premium.png" alt="ESPN Premium">
            <span>Canal 18.2</span>
        </div>

        <div class="channel-card">
            <img src="./assets/images/products/TNT_Sports_2021_logo.png" alt="TNT Sports">
            <span>Canal 20.2</span>
        </div>

    </div>
</section>
