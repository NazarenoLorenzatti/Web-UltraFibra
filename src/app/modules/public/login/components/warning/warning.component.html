<p-toast></p-toast>
<main class="auth-state-page">
  <section class="state-card">
    <div class="state-brand"><span class="brand-kicker">ULTRAFIBRA</span><img src="./assets/images/ultrafibra-logoblanco.png" alt="UltraFibra" class="state-logo"></div>
    <div class="state-content">
      <div class="state-icon state-icon--warning"><span class="pi pi-envelope"></span></div>
      <span class="eyebrow">Verificación de cuenta</span>
      <h1>Revisá tu correo electrónico</h1>
      <p>Te enviamos un mensaje de confirmación para completar la activación de tu usuario.</p>
      <div class="state-tip"><span class="pi pi-info-circle"></span><span>También revisá las carpetas de <strong>Spam</strong> o <strong>No deseados</strong>.</span></div>
      <div class="state-actions"><button type="button" class="primary-action" (click)="forwardEmail()">Reenviar correo <span class="pi pi-send"></span></button><button type="button" class="secondary-action" (click)="navigateToLogin()"><span class="pi pi-arrow-left"></span> Volver al login</button></div>
      <span class="state-reference">DNI detectado: <strong>{{ dni }}</strong></span>
    </div>
    <div class="state-accent"></div>
  </section>
</main>
