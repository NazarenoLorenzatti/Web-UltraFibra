<p-toast></p-toast>

<section class="confirm-page w-full flex justify-content-center align-items-center pt-8">
  <div class="confirm-card shadow-8 border-round-3xl">

    <!-- HEADER -->
    <div class="confirm-header flex align-items-center">
      <button
        pButton
        class="btn-back"
        icon="pi pi-arrow-left"
        label="Volver al Login"
        (click)="navigateToLogin()">
      </button>
    </div>

    <!-- CONTENT -->
    <div class="confirm-content text-center">
      <i class="pi pi-envelope confirm-icon"></i>

      <h1>¡Solo un paso más!</h1>

      <p class="main-text">
        Te enviamos un mail de confirmación a la casilla de correo registrada.
      </p>

      <p class="secondary-text">
        Revisá también la carpeta de <b>Spam</b> o <b>No Deseados</b>.
      </p>
    </div>

    <!-- ACTIONS -->
    <div class="confirm-actions">
      <button
        pButton
        class="btn-primary w-10 md:w-6"
        icon="pi pi-refresh"
        label="Reenviar Email"
        (click)="forwardEmail()">
      </button>

      <p class="help-text w-11 md:w-8">
        Si no podés completar el registro, contactate con nosotros y con gusto te brindamos las credenciales.
      </p>
    </div>

    <!-- FOOTER -->
    <div class="confirm-footer"></div>

  </div>
</section>
