<p-toast></p-toast>
<main class="auth-state-page">
  <section class="state-card">
    <div class="state-brand"><span class="brand-kicker">ULTRAFIBRA</span><img src="./assets/images/ultrafibra-logoblanco.png" alt="UltraFibra" class="state-logo"></div>
    <div class="state-content">
      <div class="state-icon state-icon--success"><span class="pi pi-check"></span></div>
      <span class="eyebrow">Cuenta confirmada</span>
      <h1>¡Bienvenido!</h1>
      <p>Tu correo <strong>{{ email }}</strong> fue validado correctamente.</p>
      <div class="state-tip state-tip--success"><span class="pi pi-check-circle"></span><span>Ya podés ingresar al área de usuario con tu <strong>DNI</strong> y <strong>contraseña</strong>.</span></div>
      <div class="state-actions"><button type="button" class="primary-action" (click)="navigateToLogin()">Ingresar al portal <span class="pi pi-arrow-right"></span></button></div>
    </div>
    <div class="state-accent"></div>
  </section>
</main>
