<div class="fixed bottom-0 right-0  h-6rem w-6rem flex justify-content-center align-items-center" style="z-index: 100;">
    <div (click)="goToWhatsapp()" class="w-full h-full relative flex justify-content-center align-items-center cursor-pointer">
        <div class="heartbeat z-5 h-4rem w-4rem flex justify-content-center align-items-center border-circle"
            style="background-color: var(--green-400)">
            <i class="pi pi-whatsapp" style="font-size: 2rem"></i>
        </div>
        <div [ngClass]="{ 'chip-in': showDiv, 'chip-out': !showDiv }" class="absolute chip flex justify-content-start pl-4 align-items-center">
            <div class="text-base font-light">Escribinos</div>
        </div>
    </div>
</div>
