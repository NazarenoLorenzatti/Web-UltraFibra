<section
  class="parallax-section"
  [ngClass]="{
    'align-right': isRight,
    'align-left': !isRight
  }"
  [style.backgroundImage]="'url(' + img + ')'">

  <div class="content-wrapper tracking-element slide-in">
    <h1>{{ text }}</h1>

    <button
      class="cta-btn"
      [ngClass]="{
        'color-0': colorButton === 0,
        'color-1': colorButton === 1,
        'color-2': colorButton === 2
      }"
      type="button"
      (click)="goTo(urlNav)">
      {{ textButton }}
      <i class="pi pi-arrow-right ml-2" aria-hidden="true"></i>
    </button>
  </div>
</section>
