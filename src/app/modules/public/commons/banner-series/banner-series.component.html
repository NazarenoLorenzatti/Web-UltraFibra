<section *ngIf="section"
    class="feature-section w-full flex flex-column lg:flex-row justify-content-center align-items-center">

    <!-- TEXTO -->
    <div class="feature-text w-full lg:w-5 flex flex-column justify-content-center align-items-center lg:align-items-start">
        <span class="feature-eyebrow">Nuestra tecnología</span>

        <h1 class="feature-title">
            {{ section.texts[0]?.text || 'Cargando…' }}
        </h1>

        <p class="feature-description">
            {{ section.texts[1]?.text || 'Cargando…' }}
        </p>
    </div>

    <!-- CARRUSEL -->
    <div class="feature-carousel w-full lg:w-6">
        <p-carousel
            [value]="section.imgs"
            [numVisible]="3"
            [numScroll]="1"
            [circular]="true"
            [autoplayInterval]="5000"
            [responsiveOptions]="responsiveOptions"
            [showIndicators]="false"
            class="carousel-wrapper">

            <ng-template let-img pTemplate="item">
                <div class="carousel-item">
                    <img
                        [src]="img.urlObs"
                        [alt]="img.description"
                        loading="lazy" />
                </div>
            </ng-template>
        </p-carousel>
    </div>
</section>

<!-- LOADING -->
<section *ngIf="!section"
    class="feature-loading w-full flex justify-content-center align-items-center">
    <p-progressSpinner
        styleClass="w-4rem h-4rem"
        strokeWidth="8"
        fill="var(--green-400)"
        animationDuration=".5s">
    </p-progressSpinner>
</section>
