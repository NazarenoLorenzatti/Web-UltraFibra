<section *ngIf="section" class="series-section">
    <div class="series-shell">

        <div class="series-copy">
            <span class="series-eyebrow">Experiencia UltraFibra</span>

            <h2>
                {{ section.texts[0]?.text || 'Entretenimiento para disfrutar en casa' }}
            </h2>

            <p>
                {{ section.texts[1]?.text || 'Descubrí una propuesta pensada para acompañar tu conexión.' }}
            </p>
        </div>

        <div class="series-gallery">
            <div
                *ngFor="let img of section.imgs"
                class="series-card">
                <img
                    [src]="img.urlObs"
                    [alt]="img.description || 'UltraFibra'"
                    loading="lazy">
            </div>
        </div>
    </div>
</section>

<section *ngIf="!section" class="series-loading">
    <p-progressSpinner strokeWidth="6" animationDuration=".6s"></p-progressSpinner>
</section>
