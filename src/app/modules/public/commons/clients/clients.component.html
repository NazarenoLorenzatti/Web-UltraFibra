<section *ngIf="section" class="clients-section">

    <!-- TÍTULO -->
    <div class="clients-header">
        <h1>Confían en nosotros</h1>
        <p class="text-black-alpha-50">
            Empresas y organizaciones que eligen nuestra red de fibra óptica
        </p>
    </div>

    <!-- LOGOS -->
    <div class="clients-logos">

        <div
            *ngFor="let img of section.imgs"
            class="client-logo-card">

            <img
                [src]="img.urlObs"
                [alt]="img.description" />

        </div>

    </div>

</section>

<!-- LOADING -->
<section *ngIf="!section" class="clients-loading">
    <p-progressSpinner
        styleClass="w-4rem h-4rem"
        strokeWidth="6"
        animationDuration=".6s">
    </p-progressSpinner>
</section>
