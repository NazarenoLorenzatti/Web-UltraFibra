<section *ngIf="section" class="clients-section">
  <div class="clients-container">
    <div class="clients-heading">
      <span class="clients-eyebrow">CONFIAN EN ULTRAFIBRA</span>
      <h2>Una conexión que ya forma parte de muchos hogares y negocios.</h2>
      <p>Una selección de marcas y organizaciones que confían en nuestra conectividad.</p>
    </div>

    <div class="clients-grid">
      <div *ngFor="let img of section.imgs" class="client-logo">
        <img [src]="img.urlObs" [alt]="img.description || 'Cliente UltraFibra'" />
      </div>
    </div>
  </div>
</section>

<section *ngIf="!section" class="clients-loading" aria-hidden="true"></section>
