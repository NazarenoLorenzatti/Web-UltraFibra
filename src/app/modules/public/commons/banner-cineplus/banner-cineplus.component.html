<section *ngIf="backgroundImageUrl" class="media-banner media-banner--dark">
    <div class="media-banner__media"
        [style.background-image]="'url(' + backgroundImageUrl + ')'">
    </div>

    <div class="media-banner__overlay"></div>

    <div class="media-banner__content">
        <span class="media-eyebrow">Entretenimiento</span>

        <h2>
            Las mejores series y películas
            <span>en streaming.</span>
        </h2>

        <p>
            Conectate a nuestra red, ingresá a la plataforma y disfrutá.
        </p>

        <a
            href="https://cineplus.com.ar/"
            target="_blank"
            rel="noopener noreferrer"
            class="media-button">
            <span>Conocer Cineplus</span>
            <i class="pi pi-arrow-up-right"></i>
        </a>
    </div>
</section>
