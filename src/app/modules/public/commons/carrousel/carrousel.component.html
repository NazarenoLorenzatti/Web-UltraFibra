<section class="hero-section">
  <p-carousel
    [value]="listSlides"
    [numVisible]="1"
    [numScroll]="1"
    [showNavigators]="false"
    [showIndicators]="true"
    [autoplayInterval]="10000"
    styleClass="uf-hero-carousel">

    <ng-template let-slide pTemplate="item">
      <article class="hero-slide">
        <img
          class="hero-image"
          [src]="slide.route"
          [alt]="slide.title" />

        <div class="hero-overlay"></div>

        <div class="hero-content">
          <span class="hero-kicker">ULTRAFIBRA</span>
          <h1>{{ slide.title }}</h1>
          <p>{{ slide.info }}</p>
          <app-button-p2-utlra
            label="{{ slide.btn }}"
            url="{{ slide.url }}">
          </app-button-p2-utlra>
        </div>
      </article>
    </ng-template>
  </p-carousel>
</section>
