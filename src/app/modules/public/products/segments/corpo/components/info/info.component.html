<section class="feature-section">
    <div class="feature-wrapper" [class.reverse]="reverse">

        <div class="feature-media">
            <div class="feature-number">
                {{ index | number:'2.0-0' }}
            </div>

            <img [src]="img" [alt]="title" loading="lazy">

            <div class="media-shine" aria-hidden="true"></div>
        </div>

        <div class="feature-content">
            <span class="feature-eyebrow">Solución {{ index | number:'2.0-0' }}</span>
            <h2 class="feature-title">{{ title }}</h2>
            <p class="feature-text">{{ article }}</p>
            <span class="feature-line" aria-hidden="true"></span>
        </div>

    </div>
</section>
