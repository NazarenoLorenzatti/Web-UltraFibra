<section class="pymes-plans">
    <div class="plans-grid">
        <article
            *ngFor="let plan of plans"
            class="plan-card"
            [class.plan-card--featured]="plan.featured">

            <div class="plan-card__topline">
                <span>{{ plan.type }}</span>
                <span *ngIf="plan.featured" class="plan-badge">Recomendado</span>
            </div>

            <div class="plan-speed">
                <span class="plan-speed__number">{{ plan.speed }}</span>
                <span class="plan-speed__unit">MB</span>
            </div>

            <span class="plan-extra">{{ plan.extra }}</span>

            <div class="plan-divider"></div>

            <div class="plan-price">
                <span class="plan-price__currency">$</span>
                <span>{{ plan.price.replace('$', '') }}</span>
            </div>

            <div class="plan-meta">
                <span>Finales por mes</span>
                <strong>{{ plan.period }}</strong>
            </div>

            <!--button
                type="button"
                class="plan-action"
                (click)="contratarPlan(plan)">
                Contratar plan
                <span class="pi pi-arrow-right"></span>
            </button-->
        </article>
    </div>
</section>
