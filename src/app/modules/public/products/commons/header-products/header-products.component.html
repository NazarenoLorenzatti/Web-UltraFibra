<section class="product-hero" [style.background-image]="
        'linear-gradient(100deg, rgba(5,15,28,.78) 0%, rgba(5,15,28,.46) 48%, rgba(5,15,28,.18) 100%), url(' + backgroundImg + ')'
    ">
    <div class="product-hero__texture" aria-hidden="true"></div>

    <div class="product-hero__content">
        <div class="product-hero__eyebrow">
            <span>UltraFibra</span>
            <span class="dot"></span>
            <span>Hogar</span>
        </div>

        <h1>
            <span>{{ title }}</span>
            {{ subTitle }}
        </h1>

        <p>
            Conectividad para tu hogar, pensada para acompañar todo lo que hacés.
        </p>

        <a class="product-hero__scroll" href="#" (click)="onScrollToPlans(); $event.preventDefault()">
            <span>Conocé los planes</span>
            <i class="pi pi-arrow-down"></i>
        </a>
    </div>
</section>
