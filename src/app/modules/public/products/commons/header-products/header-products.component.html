<section
    class="hero-header w-full flex justify-content-end align-items-end mt-7"
    [style.background-image]="
        'linear-gradient(180deg,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.55) 60%,
        rgba(0,0,0,0.85) 100%),
        url(' + backgroundImg + ')'
    "
>
    <div class="hero-content w-11 md:w-auto">
        <h2 class="hero-title">{{ title }}</h2>
        <h1 class="hero-subtitle">{{ subTitle }}</h1>
    </div>
</section>
